<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Shuffle | Master Control</title>
    <link rel="preconnect" href="https://archive.org">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0047ab;
            --dead-red: #ff0000;
            --betty-gold: #ffcc00;
            --bg-gradient: linear-gradient(135deg, #050a30, #000c66, #000000);
            --glass: rgba(255, 255, 255, 0.08);
        }

        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 95%; max-width: 550px; position: relative; }

        .player-card {
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 37px;
            padding: 34px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
            text-align: center;
            position: relative;
        }

        /* SYF & LOADING STATUS */
        .syf-wrapper { width: 138px; height: 138px; margin: 0 auto 10px; position: relative; transition: all 0.5s ease; will-change: transform; }
        .syf-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255,255,255,0.15)); }

        #searchStatus {
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            height: 18px;
            margin-bottom: 12px;
            opacity: 0;
            transition: opacity 0.3s, color 0.3s;
        }

        /* STATUS COLORS */
        .status-betty { color: var(--betty-gold) !important; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* LOADING ANIMATIONS */
        .loading #searchStatus { opacity: 1; }
        .loading .syf-wrapper { animation: spin 4s linear infinite; filter: saturate(0.5) blur(1px); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #trackTitle { font-size: 1.5rem; margin: 0 0 8px 0; font-weight: 800; color: #fff; height: 1.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .meta-text { margin-bottom: 17px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        #showDate { font-size: 1.65rem; font-weight: 800; color: var(--dead-red); letter-spacing: -0.02em; }
        #showLocation { font-size: 1.1rem; font-weight: 600; opacity: 0.8; color: #fff; }

        .progress-area { margin-bottom: 20px; padding: 0 10px; }
        .progress-bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; position: relative; overflow: hidden; }
        .progress-fill { height: 100%; width: 100%; transform: scaleX(0); transform-origin: left; background: var(--dead-red); border-radius: 10px; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); will-change: transform; }
        .time-info { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 10px; font-weight: 700; opacity: 0.6; }

        .main-controls { display: flex; justify-content: center; align-items: center; gap: 18px; margin-bottom: 16px; }
        .btn-shuffle { background: #111; padding: 11px 18px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2); color: white; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.78rem; letter-spacing: 1px; flex-shrink: 0; }
        .btn-history { background: var(--betty-gold); color: #000; padding: 11px 20px; border-radius: 40px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 16px; width: 100%; }
        .btn-primary { background: var(--primary); width: 66px; height: 66px; min-width: 66px; border-radius: 50%; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0, 71, 171, 0.5); flex-shrink: 0; }
        .btn-skip { background: rgba(255,255,255,0.1); width: 49px; height: 49px; min-width: 49px; border-radius: 50%; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .btn-setlist-toggle { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 8px 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: white; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }

        .volume-container { margin-top: 8px; padding: 0 20px; margin-bottom: 20px; }
        .volume-slider { -webkit-appearance: none; width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; outline: none; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #fff; border-radius: 50%; border: 3px solid var(--dead-red); cursor: pointer; }

        .filter-dock { background: rgba(0,0,0,0.5); padding: 17px; border-radius: 22px; display: flex; flex-direction: column; gap: 10px; }
        .source-selector { display: flex; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 4px; }
        .source-btn { flex: 1; border: none; background: transparent; color: rgba(255,255,255,0.5); padding: 9px; font-size: 0.75rem; font-weight: 800; cursor: pointer; border-radius: 8px; }
        .source-btn.active { background: var(--dead-red); color: white; }
        .filter-input { flex: 1; min-width: 0; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 12px; color: white; font-size: 0.9rem; text-align: center; }

        #setlist-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 10, 48, 0.99); border-radius: 40px; z-index: 100; padding: 30px; transform: translateY(105%); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; display: flex; flex-direction: column; will-change: transform; }
        #setlist-panel.open { transform: translateY(0); }
        .setlist-header { display:flex; justify-content:space-between; margin-bottom:20px; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;}
        .setlist-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; font-size: 1.1rem; opacity: 0.7; text-align: left; }
        .setlist-item.active { color: var(--dead-red); opacity: 1; font-weight: 800; border-left: 4px solid var(--dead-red); padding-left: 11px; }

        @keyframes betty-flash { 0%, 100% { box-shadow: 0 0 20px #ff0000; background: #ff0000; } 50% { box-shadow: 0 0 45px var(--betty-gold); background: var(--betty-gold); } }
        .betty-active { animation: betty-flash 0.6s infinite !important; border: 3px solid white !important; color: #000 !important; }
    </style>
</head>
<body>

<div class="app-container" id="mainApp">
    <div class="player-card">
        <div id="setlist-panel">
            <div class="setlist-header">
                <span style="font-weight:800; font-size: 1.2rem; letter-spacing:2px; color: var(--dead-red);">SHOW SETLIST</span>
                <button onclick="toggleSetlist()" style="background:rgba(255,255,255,0.1); border:none; color:white; font-size:1.5rem; cursor:pointer; width: 40px; height: 40px; border-radius: 50%;">✕</button>
            </div>
            <div id="setlist-content" style="overflow-y:auto; flex-grow:1;"></div>
        </div>

        <div class="syf-wrapper">
            <img src="Logo-Steal-your-face.webp" class="syf-img" alt="SYF">
        </div>

        <div id="searchStatus">SCANNING THE VAULT...</div>

        <div class="track-info">
            <div class="meta-text">
                <span id="showDate">SELECT SHOW</span>
                <span id="showLocation">Ready to Jam</span>
            </div>
            <h2 id="trackTitle">Dead Shuffle</h2>
        </div>

        <div class="progress-area">
            <div class="progress-bar-container" id="progressContainer"><div class="progress-fill" id="progressFill"></div></div>
            <div class="time-info"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
        </div>

        <div class="main-controls">
            <button id="shuffleBtn" class="btn-shuffle" onclick="masterShuffle()">Shuffle</button>
            <button id="playPauseBtn" class="btn-primary" onclick="togglePlayPause()">
                <svg id="playIcon" width="30" height="30" fill="white" viewBox="0 0 24 24"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
                <svg id="pauseIcon" style="display:none;" width="30" height="30" fill="white" viewBox="0 0 24 24"><path d="M14,19H18V5H14M6,19H10V5H6V19Z"/></svg>
            </button>
            <button class="btn-skip" onclick="skipTrack()">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M6,18L14.5,12L6,6V18M16,6V18H18V6H16Z"/></svg>
            </button>
            <button class="btn-setlist-toggle" onclick="toggleSetlist()"><span>☰</span></button>
        </div>

        <button class="btn-history" onclick="todayInHistory()">Today in History</button>

        <div class="volume-container">
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>

        <div class="filter-dock">
            <input type="text" id="songFilter" class="filter-input" placeholder="Request Song (e.g. Terrapin)">
            <div class="source-selector">
                <button class="source-btn active" id="btnSbd" onclick="setSource('SBD', this)">SBD</button>
                <button class="source-btn" id="btnAud" onclick="setSource('AUD', this)">AUD</button>
                <button class="source-btn" id="btnBoth" onclick="setSource('BOTH', this)">BOTH</button>
            </div>
            <div style="display:flex; gap:10px;">
                <input type="number" id="yearFilter" class="filter-input" placeholder="Year">
                <input type="text" id="exactDate" class="filter-input" placeholder="YYYY-MM-DD">
            </div>
        </div>

        <audio id="player"></audio>
    </div>
</div>

<script>
    let currentShowTracks = [];
    let currentIdentifier = "";
    let currentIndex = 0;
    let selectedSource = "SBD";

    const player = document.getElementById("player");
    const volumeSlider = document.getElementById("volumeSlider");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const progressFill = document.getElementById("progressFill");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const mainApp = document.getElementById("mainApp");
    const statusHUD = document.getElementById("searchStatus");

    // Throttle progress updates to animation frames — avoids layout thrash on every ontimeupdate tick
    let rafId = null;
    player.ontimeupdate = () => {
        if (rafId) return;
        rafId = requestAnimationFrame(() => {
            rafId = null;
            if (player.duration) {
                progressFill.style.transform = `scaleX(${player.currentTime / player.duration})`;
                currentTimeEl.innerText = formatTime(player.currentTime);
                durationEl.innerText = formatTime(player.duration);
            }
        });
    };

    document.getElementById("progressContainer").onclick = (e) => {
        const width = e.currentTarget.clientWidth;
        player.currentTime = (e.offsetX / width) * player.duration;
    };

    // Single delegated listener for the setlist instead of one inline handler per track
    document.getElementById("setlist-content").addEventListener('click', e => {
        const item = e.target.closest('.setlist-item');
        if (item) playTrack(parseInt(item.dataset.idx));
    });

    function formatTime(secs) {
        const mins = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${mins}:${s < 10 ? '0' : ''}${s}`;
    }

    function setStatus(msg, isBetty = false) {
        statusHUD.innerText = msg;
        statusHUD.classList.toggle('status-betty', isBetty);
    }

    const BLOCKED = ["drums", "space", "crowd", "tuning"];
    function filterTracks(files) {
        return files.filter(f => f.name.endsWith(".mp3") && !BLOCKED.some(b => f.name.toLowerCase().includes(b)));
    }

    async function masterShuffle() {
        mainApp.classList.add('loading');
        setStatus("ACCESSING VAULT...");
        document.getElementById("shuffleBtn").classList.remove('betty-active');

        let year = document.getElementById("yearFilter").value;
        const exact = document.getElementById("exactDate").value;
        const songInput = document.getElementById("songFilter").value.trim();

        let sQuery = selectedSource === "SBD" ? "(source:SBD OR source:Betty)" :
                     selectedSource === "AUD" ? "source:AUD" :
                     "(source:SBD OR source:AUD OR source:Betty)";

        let query = `collection:GratefulDead AND ${sQuery} AND mediatype:etree`;

        if (songInput) {
            query += ` AND (title:*${encodeURIComponent(songInput)}* OR description:*${encodeURIComponent(songInput)}*)`;
            setStatus(`SEARCHING FOR ${songInput.toUpperCase()}...`);
        }

        if (exact) query += ` AND date:${exact}`;
        else if (year) query += ` AND date:[${year}-01-01 TO ${year}-12-31]`;
        else if (!songInput) {
            const years = Array.from({length: 31}, (_, i) => 1965 + i);
            year = years[Math.floor(Math.random() * years.length)];
            query += ` AND date:[${year}-01-01 TO ${year}-12-31]`;
        }

        try {
            // rows=50 instead of 300 — we only inspect 15 candidates max
            const res = await fetch(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl[]=identifier&rows=50&output=json`);
            const data = await res.json();

            if (data.response.docs.length > 0) {
                const shuffledDocs = data.response.docs.sort(() => Math.random() - 0.5);

                if (songInput) {
                    // Race all candidates in parallel instead of checking them sequentially
                    const s = songInput.toLowerCase();
                    const candidates = shuffledDocs.slice(0, 15).map(async doc => {
                        const meta = await (await fetch(`https://archive.org/metadata/${doc.identifier}`)).json();
                        const mp3s = filterTracks(meta.files);
                        const idx = mp3s.findIndex(t => (t.title || "").toLowerCase().includes(s) || (t.name || "").toLowerCase().includes(s));
                        if (idx === -1) throw new Error('not found');
                        return { id: doc.identifier, meta, mp3s, idx };
                    });
                    try {
                        const result = await Promise.any(candidates);
                        await applyShow(result.id, result.meta, result.mp3s, result.idx, false);
                        mainApp.classList.remove('loading');
                        return;
                    } catch (e) { /* none of the candidates had the song — fall through to random */ }
                }

                await loadShow(shuffledDocs[0].identifier, true, "");
            } else {
                alert("Nothing found. Try a different era!");
            }
        } catch(e) { console.error(e); }
        mainApp.classList.remove('loading');
    }

    async function todayInHistory() {
        mainApp.classList.add('loading');
        setStatus("SEARCHING HISTORY...");
        const today = new Date();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        // Wildcards don't work on Solr date fields — build explicit OR for each GD year
        const dateOr = Array.from({length: 31}, (_, i) => `date:${1965 + i}-${month}-${day}`).join(' OR ');
        const query = `collection:GratefulDead AND mediatype:etree AND (${dateOr})`;
        try {
            const res = await fetch(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl[]=identifier&rows=50&output=json`);
            const data = await res.json();
            if (data.response.docs.length > 0) {
                await loadShow(data.response.docs[Math.floor(Math.random() * data.response.docs.length)].identifier, false);
            } else {
                alert(`No Grateful Dead shows found on ${month}/${day} in history.`);
            }
        } catch(e) { console.error(e); masterShuffle(); }
        mainApp.classList.remove('loading');
    }

    // Separated from loadShow so the parallel song-search path can reuse pre-fetched metadata
    async function applyShow(id, meta, mp3s, startIdx, pickRandom) {
        currentIdentifier = id;
        currentShowTracks = mp3s;

        const sourceInfo = (meta.metadata.source || "").toLowerCase() + (meta.metadata.notes || "").toLowerCase();
        const isBetty = sourceInfo.includes("betty");
        if (isBetty) {
            setStatus("BETTY BOARD DETECTED", true);
            document.getElementById("shuffleBtn").classList.add('betty-active');
            await new Promise(r => setTimeout(r, 1200));
        }

        document.getElementById("showDate").innerText = meta.metadata.date || "Unknown Date";
        document.getElementById("showLocation").innerText = meta.metadata.venue || meta.metadata.coverage || "Unknown Location";
        document.getElementById("setlist-content").innerHTML = currentShowTracks
            .map((t, i) => `<div class="setlist-item" data-idx="${i}">${i+1}. ${t.title || t.name}</div>`)
            .join("");
        playTrack(startIdx !== -1 ? startIdx : (pickRandom ? Math.floor(Math.random() * currentShowTracks.length) : 0));
        return true;
    }

    async function loadShow(id, pickRandom, songSearch = "") {
        const meta = await (await fetch(`https://archive.org/metadata/${id}`)).json();
        const mp3s = filterTracks(meta.files);
        let startIdx = -1;
        if (songSearch) {
            const s = songSearch.toLowerCase();
            startIdx = mp3s.findIndex(t => (t.title || "").toLowerCase().includes(s) || (t.name || "").toLowerCase().includes(s));
        }
        return applyShow(id, meta, mp3s, startIdx, pickRandom);
    }

    function playTrack(i){
        if(!currentShowTracks[i]) return;
        currentIndex = i;
        const track = currentShowTracks[i];
        document.getElementById("trackTitle").innerText = track.title || track.name;
        player.src = `https://archive.org/download/${currentIdentifier}/${track.name}`;
        player.play().catch(() => {});
        updateUI(true);
        document.querySelectorAll(".setlist-item").forEach((el, idx) => el.classList.toggle("active", idx === i));
    }

    function skipTrack(){ masterShuffle(); }
    function togglePlayPause() { player.paused ? (player.play(), updateUI(true)) : (player.pause(), updateUI(false)); }
    function updateUI(isPlaying) { playIcon.style.display = isPlaying ? "none" : "block"; pauseIcon.style.display = isPlaying ? "block" : "none"; }
    function setSource(src, btn) {
        selectedSource = src;
        document.getElementById('btnSbd').classList.remove('active');
        document.getElementById('btnAud').classList.remove('active');
        document.getElementById('btnBoth').classList.remove('active');
        btn.classList.add('active');
    }
    function toggleSetlist(){ document.getElementById("setlist-panel").classList.toggle("open"); }
    player.onended = () => skipTrack();
    volumeSlider.oninput = (e) => { player.volume = e.target.value; };
</script>
</body>
</html>
