<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Shuffle | Master Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0047ab;
            --dead-red: #ff0000;
            --betty-gold: #ffcc00;
            --bg-gradient: linear-gradient(135deg, #050a30, #000c66, #000000);
            --glass: rgba(255, 255, 255, 0.08);
        }

        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* LARGER CONTAINER */
        .app-container { width: 95%; max-width: 550px; position: relative; }
        
        .player-card { 
            background: var(--glass); 
            backdrop-filter: blur(40px); 
            border: 1px solid rgba(255,255,255,0.15); 
            border-radius: 40px; 
            padding: 40px; 
            box-shadow: 0 60px 120px rgba(0, 0, 0, 0.9); 
            text-align: center; 
            position: relative; 
        }

        /* LARGER LOGO */
        .syf-wrapper { width: 180px; height: 180px; margin: 0 auto 20px; position: relative; }
        .syf-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255,255,255,0.15)); }

        /* LARGER TEXT */
        #trackTitle { font-size: 1.6rem; margin: 0 0 10px 0; font-weight: 800; color: #fff; height: 2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .meta-text { margin-bottom: 20px; display: flex; flex-direction: column; gap: 5px; align-items: center; }
        #showDate { font-size: 1.8rem; font-weight: 800; color: var(--dead-red); letter-spacing: -0.02em; }
        #showLocation { font-size: 1.2rem; font-weight: 600; opacity: 0.8; color: #fff; }

        /* PROGRESS BAR */
        .progress-area { margin-bottom: 25px; padding: 0 10px; }
        .progress-bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; width: 0%; background: var(--dead-red); border-radius: 10px; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        .time-info { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 10px; font-weight: 700; opacity: 0.6; }

        /* CONTROLS */
        .main-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .btn-shuffle { background: #111; padding: 12px 20px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2); color: white; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .btn-history { background: var(--betty-gold); color: #000; padding: 12px 20px; border-radius: 40px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 20px; width: 100%; box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3); }
        .btn-primary { background: var(--primary); width: 70px; height: 70px; border-radius: 50%; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0, 71, 171, 0.5); transition: transform 0.2s; }
        .btn-primary:active { transform: scale(0.95); }
        .btn-skip { background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* SETLIST TOGGLE - MORE VISIBLE */
        .btn-setlist-toggle { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: white; font-weight: 700; font-size: 0.9rem; transition: background 0.3s; }
        .btn-setlist-toggle:hover { background: rgba(255,255,255,0.2); }

        /* VOLUME */
        .volume-container { margin-top: 10px; padding: 0 20px; margin-bottom: 25px; }
        .volume-slider { -webkit-appearance: none; width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; outline: none; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #fff; border-radius: 50%; border: 3px solid var(--dead-red); cursor: pointer; }

        /* FILTERS */
        .filter-dock { background: rgba(0,0,0,0.5); padding: 20px; border-radius: 25px; display: flex; flex-direction: column; gap: 12px; }
        .source-selector { display: flex; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 4px; }
        .source-btn { flex: 1; border: none; background: transparent; color: rgba(255,255,255,0.5); padding: 10px; font-size: 0.75rem; font-weight: 800; cursor: pointer; border-radius: 8px; }
        .source-btn.active { background: var(--dead-red); color: white; }
        .filter-input { flex: 1; min-width: 0; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 12px; color: white; font-size: 0.9rem; text-align: center; }
        
        /* LARGER SETLIST PANEL */
        #setlist-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 10, 48, 0.99); border-radius: 40px; z-index: 100; padding: 30px; transform: translateY(105%); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; display: flex; flex-direction: column; }
        #setlist-panel.open { transform: translateY(0); }
        .setlist-header { display:flex; justify-content:space-between; margin-bottom:20px; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;}
        .setlist-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; font-size: 1.1rem; opacity: 0.7; text-align: left; transition: 0.2s; }
        .setlist-item:hover { background: rgba(255,255,255,0.05); opacity: 1; }
        .setlist-item.active { color: var(--dead-red); opacity: 1; font-weight: 800; background: rgba(255,0,0,0.05); border-left: 4px solid var(--dead-red); }

        @keyframes betty-flash { 0%, 100% { box-shadow: 0 0 20px #ff0000; background: #ff0000; } 50% { box-shadow: 0 0 35px #0047ab; background: #0047ab; } }
        .betty-active { animation: betty-flash 0.8s infinite !important; border: 2px solid var(--betty-gold) !important; color: white !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="player-card">
        <div id="setlist-panel">
            <div class="setlist-header">
                <span style="font-weight:800; font-size: 1.2rem; letter-spacing:2px; color: var(--dead-red);">SHOW SETLIST</span>
                <button onclick="toggleSetlist()" style="background:rgba(255,255,255,0.1); border:none; color:white; font-size:1.5rem; cursor:pointer; width: 40px; height: 40px; border-radius: 50%;">✕</button>
            </div>
            <div id="setlist-content" style="overflow-y:auto; flex-grow:1; padding-right: 10px;"></div>
        </div>

        <div class="syf-wrapper">
            <img src="Logo-Steal-your-face.webp" class="syf-img" alt="SYF">
        </div>

        <div class="track-info">
            <div class="meta-text">
                <span id="showDate">SELECT SHOW</span>
                <span id="showLocation">Ready to Jam</span>
            </div>
            <h2 id="trackTitle">Dead Shuffle</h2>
        </div>

        <div class="progress-area">
            <div class="progress-bar-container" id="progressContainer"><div class="progress-fill" id="progressFill"></div></div>
            <div class="time-info"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
        </div>

        <div class="main-controls">
            <button id="shuffleBtn" class="btn-shuffle" onclick="masterShuffle()">Shuffle</button>
            
            <button id="playPauseBtn" class="btn-primary" onclick="togglePlayPause()">
                <svg id="playIcon" width="30" height="30" fill="white" viewBox="0 0 24 24"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
                <svg id="pauseIcon" style="display:none;" width="30" height="30" fill="white" viewBox="0 0 24 24"><path d="M14,19H18V5H14M6,19H10V5H6V19Z"/></svg>
            </button>

            <button class="btn-skip" onclick="skipTrack()">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M6,18L14.5,12L6,6V18M16,6V18H18V6H16Z"/></svg>
            </button>
            
            <button class="btn-setlist-toggle" onclick="toggleSetlist()">
                <span>☰</span> <span>SETLIST</span>
            </button>
        </div>

        <button class="btn-history" onclick="todayInHistory()">Today in History</button>

        <div class="volume-container">
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>

        <div class="filter-dock">
            <input type="text" id="songFilter" class="filter-input" placeholder="Request Song (e.g. Terrapin)">
            <div class="source-selector">
                <button class="source-btn active" id="btnSbd" onclick="setSource('SBD', this)">SOUNDBOARD</button>
                <button class="source-btn" id="btnAud" onclick="setSource('AUD', this)">AUDIENCE</button>
                <button class="source-btn" id="btnBoth" onclick="setSource('BOTH', this)">BOTH</button>
            </div>
            <div style="display:flex; gap:10px;">
                <input type="number" id="yearFilter" class="filter-input" placeholder="Year">
                <input type="text" id="exactDate" class="filter-input" placeholder="YYYY-MM-DD">
            </div>
        </div>

        <audio id="player"></audio>
    </div>
</div>

<script>
    let currentShowTracks = [];
    let currentIdentifier = "";
    let currentIndex = 0;
    let selectedSource = "SBD";

    const player = document.getElementById("player");
    const volumeSlider = document.getElementById("volumeSlider");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const progressFill = document.getElementById("progressFill");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");

    player.ontimeupdate = () => {
        if (player.duration) {
            const pct = (player.currentTime / player.duration) * 100;
            progressFill.style.width = pct + "%";
            currentTimeEl.innerText = formatTime(player.currentTime);
            durationEl.innerText = formatTime(player.duration);
        }
    };

    document.getElementById("progressContainer").onclick = (e) => {
        const width = e.currentTarget.clientWidth;
        player.currentTime = (e.offsetX / width) * player.duration;
    };

    function formatTime(secs) {
        const mins = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${mins}:${s < 10 ? '0' : ''}${s}`;
    }

    async function masterShuffle() {
        document.getElementById("shuffleBtn").classList.remove('betty-active');
        let year = document.getElementById("yearFilter").value;
        const exact = document.getElementById("exactDate").value;
        const songInput = document.getElementById("songFilter").value.trim();

        if (!year && !exact && !songInput) {
            const years = Array.from({length: 31}, (_, i) => 1965 + i);
            year = years[Math.floor(Math.random() * years.length)];
        }

        let sQuery = selectedSource === "SBD" ? "(source:SBD OR source:Betty)" : 
                     selectedSource === "AUD" ? "source:AUD" : 
                     "(source:SBD OR source:AUD OR source:Betty)";
        
        let query = `collection:GratefulDead AND ${sQuery} AND mediatype:etree`;
        
        if (songInput) {
            const encodedSong = encodeURIComponent(`*${songInput}*`);
            query += ` AND (title:${encodedSong} OR subject:${encodedSong} OR description:${encodedSong})`;
        }
        
        if (exact) query += ` AND date:${exact}`; 
        else if (year) query += ` AND date:[${year}-01-01 TO ${year}-12-31]`;

        try {
            const res = await fetch(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl[]=identifier&rows=500&output=json`);
            const data = await res.json();
            if (data.response.docs.length > 0) {
                const randomShow = data.response.docs[Math.floor(Math.random() * data.response.docs.length)].identifier;
                loadShow(randomShow, true, songInput);
            } else {
                alert("Nothing found. Try a different song or year!");
            }
        } catch(e) { console.error(e); }
    }

    async function todayInHistory() {
        const today = new Date();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const query = `collection:GratefulDead AND date:*-${month}-${day} AND mediatype:etree`;
        try {
            const res = await fetch(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl[]=identifier&rows=50&output=json`);
            const data = await res.json();
            if (data.response.docs.length > 0) {
                loadShow(data.response.docs[Math.floor(Math.random() * data.response.docs.length)].identifier, false);
            } else {
                alert("No shows for today! Shuffling..."); masterShuffle();
            }
        } catch(e) { masterShuffle(); }
    }

    async function loadShow(id, pickRandom, songSearch = ""){
        currentIdentifier = id;
        const res = await fetch(`https://archive.org/metadata/${id}`);
        const meta = await res.json();
        const sourceInfo = (meta.metadata.source || "").toLowerCase() + (meta.metadata.notes || "").toLowerCase();
        
        if(sourceInfo.includes("betty")) document.getElementById("shuffleBtn").classList.add('betty-active');
        document.getElementById("showDate").innerText = meta.metadata.date || "Unknown Date";
        document.getElementById("showLocation").innerText = meta.metadata.venue || meta.metadata.coverage || "Unknown Location";
        
        currentShowTracks = meta.files.filter(f => f.name.endsWith(".mp3") && !f.name.toLowerCase().includes("drums") && !f.name.toLowerCase().includes("space"));
        const list = document.getElementById("setlist-content");
        list.innerHTML = currentShowTracks.map((t, i) => `<div class="setlist-item" onclick="playTrack(${i})">${i+1}. ${t.title || t.name}</div>`).join("");
        
        let startIdx = 0;
        if (songSearch) {
            const s = songSearch.toLowerCase();
            const foundIdx = currentShowTracks.findIndex(t => 
                (t.title || "").toLowerCase().includes(s) || 
                (t.name || "").toLowerCase().includes(s)
            );
            startIdx = foundIdx !== -1 ? foundIdx : 0;
        } else if (pickRandom) {
            startIdx = Math.floor(Math.random()*currentShowTracks.length);
        }
        playTrack(startIdx);
    }

    function playTrack(i){
        if(!currentShowTracks[i]) return;
        currentIndex = i;
        const track = currentShowTracks[i];
        document.getElementById("trackTitle").innerText = track.title || track.name;
        player.src = `https://archive.org/download/${currentIdentifier}/${track.name}`;
        player.play();
        updateUI(true);
        document.querySelectorAll(".setlist-item").forEach((el, idx) => el.classList.toggle("active", idx === i));
    }

    function skipTrack(){ masterShuffle(); }
    function togglePlayPause() { player.paused ? (player.play(), updateUI(true)) : (player.pause(), updateUI(false)); }
    function updateUI(isPlaying) { playIcon.style.display = isPlaying ? "none" : "block"; pauseIcon.style.display = isPlaying ? "block" : "none"; }
    function setSource(src, btn) {
        selectedSource = src;
        document.getElementById('btnSbd').classList.remove('active');
        document.getElementById('btnAud').classList.remove('active');
        document.getElementById('btnBoth').classList.remove('active');
        btn.classList.add('active');
    }
    function toggleSetlist(){ document.getElementById("setlist-panel").classList.toggle("open"); }
    
    player.onended = () => skipTrack();
    volumeSlider.oninput = (e) => { player.volume = e.target.value; };
    player.volume = 0.7;
</script>
</body>
</html>
